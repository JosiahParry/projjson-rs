[package]
name = "projjson"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Josiah Parry <josiah@ricochet.rs>"]
description = "Typed, lossless read/write support for PROJJSON coordinate reference system definitions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JosiahParry/projjson-rs"
documentation = "https://docs.rs/projjson"
readme = "README.md"
keywords = ["projjson", "proj", "crs", "gis", "geospatial"]
categories = ["science::geo", "parser-implementations", "encoding"]

[dependencies]
num-traits = { version = "0.2.19", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
